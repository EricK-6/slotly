name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Jest + real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: slotly
          POSTGRES_PASSWORD: slotly
          POSTGRES_DB: slotly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U slotly"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://slotly:slotly@localhost:5432/slotly_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    name: Docker build + smoke test
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack exactly as a user would
        run: docker compose up -d --build --wait

      - name: Smoke test (health, booking, double-booking -> 409)
        run: |
          set -euo pipefail
          curl -fsS localhost:3000/health
          booking='{"resource_id":1,"user_id":1,"starts_at":"2030-01-15T09:00:00Z","ends_at":"2030-01-15T10:00:00Z"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d "$booking" localhost:3000/bookings)" = 201
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d "$booking" localhost:3000/bookings)" = 409
          echo "smoke test passed"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

      # Publish the image to GHCR on main, for the Terraform deployment to pull.
      - uses: docker/setup-buildx-action@v4
        if: github.event_name == 'push'
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        if: github.event_name == 'push'
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7
        if: github.event_name == 'push'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
